onlyBuiltDependencies:
  - esbuild
  - workerd

# Unreleased inlang packages, vendored as `pnpm pack` tarballs of the release PR opral/inlang#4436
# ("Version Packages", head 55c52602, = main at 696c28a3 plus the version bumps) until they are on
# npm. The tarballs carry the exact versions that will be published: @inlang/sdk 4.0.0,
# @inlang/editor-component 13.0.0, @inlang/plugin-message-format 4.5.0, @inlang/plugin-i18next 6.4.0
# and @inlang/plugin-m-function-matcher 2.3.0. The plugins depend on "@inlang/sdk": "4.0.0", which
# npm does not have yet, hence the override below.
#
# Once they are published, run `node scripts/use-released-inlang.mjs` (switches package.json to the
# released versions, removes this override and vendor/, then `pnpm install`).
#
# Regenerate a tarball after the release PR changed: check out its head, build the package
# (`pnpm --filter @inlang/sdk build`, `pnpm --filter @inlang/editor-component build`, …),
# `pnpm pack --pack-destination <dir>` in its package directory, copy it to vendor/ with the
# `-pr.4436` suffix, then `pnpm install` here (the lockfile pins the tarball's integrity).
overrides:
  "@inlang/sdk": "file:vendor/inlang-sdk-4.0.0-pr.4436.tgz"
