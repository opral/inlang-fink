name: Deploy Worker
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true
env:
  CLOUDFLARE_ACCOUNT_ID: 11a1a6f76d167248cc6987e978efb7e5
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WRANGLER_SEND_METRICS: false
jobs:
  deploy:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Deploy with GitHub App secrets
        id: deploy
        env:
          WORKER_NAME: ${{ github.event_name == 'pull_request' && format('fink-pr-{0}', github.event.pull_request.number) || 'fink' }}
          GITHUB_CLIENT_SECRET: ${{ secrets.FINK_GITHUB_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.FINK_SESSION_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN in repository secrets.'; exit 1; }
          test -n "$GITHUB_CLIENT_SECRET" || { echo 'Set FINK_GITHUB_CLIENT_SECRET in repository secrets.'; exit 1; }
          test -n "$SESSION_SECRET" || { echo 'Set FINK_SESSION_SECRET in repository secrets.'; exit 1; }
          umask 077
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(".worker-secrets.json", JSON.stringify({ GITHUB_CLIENT_SECRET: process.env.GITHUB_CLIENT_SECRET, SESSION_SECRET: process.env.SESSION_SECRET }));'
          trap 'rm -f .worker-secrets.json' EXIT
          pnpm exec wrangler deploy --name "$WORKER_NAME" --secrets-file .worker-secrets.json
          if [ "$WORKER_NAME" = fink ]; then
            pnpm exec wrangler deploy --name fink-migration-preview --secrets-file .worker-secrets.json
          fi
          echo "url=https://${WORKER_NAME}.opral.workers.dev" >> "$GITHUB_OUTPUT"
          echo "Preview: https://${WORKER_NAME}.opral.workers.dev" >> "$GITHUB_STEP_SUMMARY"
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete closed PR Worker
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN in repository secrets.'; exit 1; }
          npx --yes wrangler@4.148.0 delete --name "fink-pr-${PR_NUMBER}" --force
